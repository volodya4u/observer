name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The Lambda and application tests call the real GitHub API and need a
      # valid GITHUB_TOKEN; the workflow token can read public repositories.
      - name: Build and test
        run: mvn -B -ntp verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
